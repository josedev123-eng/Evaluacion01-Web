# Conexión a MySQL local (XAMPP / MySQL Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_hospital?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (el esquema lo crean schema.sql / data.sql, no Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Inicialización de esquema y datos de ejemplo
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.address=127.0.0.1

# Thymeleaf
spring.thymeleaf.cache=false

# Errores: mostrar detalle en la página de error para depurar en desarrollo
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# Correo (opcional). Si no defines spring.mail.host, no se crea el bean
# JavaMailSender y la recuperación de contraseña imprime el token en la
# consola del servidor en vez de enviar un correo real. Para enviar correos
# de verdad, descomenta y completa estas líneas (usa una contraseña de
# aplicación, no la contraseña normal de la cuenta):
