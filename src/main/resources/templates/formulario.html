<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 th:text="${usuario.idUsuario == null} ? 'Registrar Usuario' : 'Editar Usuario'"></h2>

<form th:action="${usuario.idUsuario == null} ? @{/usuarios/guardar} : @{/usuarios/actualizar/{id}(id=${usuario.idUsuario})}"
      th:object="${usuario}" method="post" class="mt-3">

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Nombres:</label>
            <input type="text" th:field="*{nombres}" class="form-control" required />
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos:</label>
            <input type="text" th:field="*{apellidos}" class="form-control" required />
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">DNI:</label>
            <input type="text" th:field="*{dni}" class="form-control" />
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Correo:</label>
            <input type="email" th:field="*{correo}" class="form-control" required />
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Teléfono:</label>
            <input type="text" th:field="*{telefono}" class="form-control" />
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Usuario:</label>
            <input type="text" th:field="*{usuario}" class="form-control" required />
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Contraseña:</label>
            <input type="password" th:field="*{contrasena}" class="form-control" th:required="${usuario.idUsuario == null}" />
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Área:</label>
            <input type="text" th:field="*{area}" class="form-control" />
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Rol:</label>
            <select th:field="*{rol.idRol}" class="form-select" required>
                <option value="">-- Seleccione un Rol --</option>
                <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}"></option>
            </select>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Guardar Usuario</button>
</form>

</body>
</html>
