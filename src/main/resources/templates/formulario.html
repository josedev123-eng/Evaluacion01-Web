<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>Usuarios registrados</h2>
<table class="table table-striped">
    <thead>
    <tr>
        <th>Nombres</th>
        <th>Apellidos</th>
        <th>Correo</th>
        <th>Rol</th>
        <th>Estado</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${listaUsuarios}">
        <td th:text="${u.nombres}"></td>
        <td th:text="${u.apellidos}"></td>
        <td th:text="${u.correo}"></td>
        <td th:text="${u.rol != null ? u.rol.nombre : '-'}"></td>
        <td th:text="${u.estado} ? 'Activo' : 'Inactivo'"></td>
        <td>
            <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-outline-primary">Editar</a>
        </td>
    </tr>
    </tbody>
</table>

<hr/>

<h2 th:text="${usuarioForm.idUsuario == null} ? 'Registrar Usuario' : 'Editar Usuario'"></h2>

<form th:action="@{/usuarios/guardar}" th:object="${usuarioForm}" method="post" class="mt-3">

    <input type="hidden" th:field="*{idUsuario}" />

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Nombres:</label>
            <input type="text" th:field="*{nombres}" class="form-control" required />
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos:</label>
            <input type="text" th:field="*{apellidos}" class="form-control" required />
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">DNI:</label>
            <input type="text" th:field="*{dni}" class="form-control" />
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Correo:</label>
            <input type="email" th:field="*{correo}" class="form-control" required />
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Teléfono:</label>
            <input type="text" th:field="*{telefono}" class="form-control" />
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Usuario:</label>
            <input type="text" th:field="*{usuario}" class="form-control" required />
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Contraseña:</label>
            <input type="password" th:field="*{contrasena}" class="form-control" th:required="${usuarioForm.idUsuario == null}" />
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Área:</label>
            <input type="text" th:field="*{area}" class="form-control" />
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Rol:</label>
            <select th:field="*{rol.idRol}" class="form-select" required>
                <option value="">-- Seleccione un Rol --</option>
                <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}"></option>
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Estado:</label>
            <select th:field="*{estado}" class="form-select" required>
                <option th:value="true">Activo</option>
                <option th:value="false">Inactivo</option>
            </select>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Guardar Usuario</button>
</form>

</body>
</html>
