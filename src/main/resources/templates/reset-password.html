<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Sistema Hospitalario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card border-0 shadow-lg rounded-4 p-3" style="max-width: 420px; width: 100%;">
    <div class="card-body text-center">

        <div class="mb-3">
            <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                <i class="bi bi-check2-circle fs-2"></i>
            </div>
        </div>

        <h4 class="card-title fw-bold text-dark mb-2">Nueva Contraseña</h4>
        <p class="text-muted small mb-4">Ingresa el token recibido y define tu nueva contraseña.</p>

        <div id="alertBox" class="alert d-none text-start small rounded-3 mb-3" role="alert"></div>

        <form id="resetForm" class="text-start">
            <div class="mb-3">
                <label for="token" class="form-label fw-semibold text-secondary small">Token de Recuperación</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-check"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="token" placeholder="Pega tu token aquí" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="newPassword" class="form-label fw-semibold text-secondary small">Nueva Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="newPassword" placeholder="Mínimo 6 caracteres" required>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-success w-100 fw-bold py-2 rounded-3 shadow-sm">
                <i class="bi bi-save me-1"></i> Actualizar Contraseña
            </button>
        </form>

        <div class="mt-4 pt-3 border-top">
            <a href="/forgot-password" class="text-decoration-none small text-success fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Volver a solicitar token
            </a>
        </div>
    </div>
</div>

<script>
    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const token = document.getElementById('token').value;
        const newPassword = document.getElementById('newPassword').value;
        const alertBox = document.getElementById('alertBox');
        const btnSubmit = document.getElementById('btnSubmit');

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Actualizando...';
        alertBox.classList.add('d-none');

        try {
            const response = await fetch('/api/v1/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, newPassword: newPassword })
            });

            const data = await response.json();

            alertBox.classList.remove('d-none', 'alert-danger', 'alert-success');
            if (response.ok && data.success) {
                alertBox.classList.add('alert-success');
                alertBox.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> ' + data.message;
            } else {
                alertBox.classList.add('alert-danger');
                alertBox.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> ' + (data.message || data.token || data.newPassword || 'Error al actualizar contraseña.');
            }
        } catch (error) {
            alertBox.classList.remove('d-none');
            alertBox.classList.add('alert-danger');
            alertBox.innerHTML = '<i class="bi bi-wifi-off me-1"></i> Error de conexión con el servidor.';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="bi bi-save me-1"></i> Actualizar Contraseña';
        }
    });
</script>
</body>
</html>
