<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="barra(activo)" class="navbar navbar-expand app-navbar" aria-label="Navegación principal">
    <div class="container">
        <span class="navbar-brand text-white"><i class="bi bi-heart-pulse-fill me-2" aria-hidden="true"></i>Sistema Hospitalario</span>
        <div class="navbar-nav">
            <a class="nav-link text-white" th:classappend="${activo == 'inicio'} ? 'is-current'"
               th:attr="aria-current=${activo == 'inicio' ? 'page' : null}" th:href="@{/dashboard}">
                <i class="bi bi-grid-1x2 me-1" aria-hidden="true"></i>Inicio</a>
            <a th:if="${puedeVerUsuarios}" class="nav-link text-white" th:classappend="${activo == 'usuarios'} ? 'is-current'"
               th:attr="aria-current=${activo == 'usuarios' ? 'page' : null}" th:href="@{/usuarios}">
                <i class="bi bi-people me-1" aria-hidden="true"></i>Usuarios</a>
            <a th:if="${puedeVerRoles}" class="nav-link text-white" th:classappend="${activo == 'roles'} ? 'is-current'"
               th:attr="aria-current=${activo == 'roles' ? 'page' : null}" th:href="@{/roles}">
                <i class="bi bi-shield-check me-1" aria-hidden="true"></i>Roles</a>
            <a th:if="${puedeVerAuditoria}" class="nav-link text-white" th:classappend="${activo == 'auditoria'} ? 'is-current'"
               th:attr="aria-current=${activo == 'auditoria' ? 'page' : null}" th:href="@{/auditoria}">
                <i class="bi bi-journal-check me-1" aria-hidden="true"></i>Auditoría</a>
            <a class="nav-link text-white logout-link" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Salir</a>
        </div>
    </div>
</nav>
</body>
</html>
