<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Sistema Hospitalario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="auth-page d-flex align-items-center justify-content-center p-3">

<main class="card auth-card w-100" style="max-width: 410px;">
    <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="auth-mark mb-3"><i class="bi bi-heart-pulse-fill"></i></div>
            <div class="auth-kicker mb-1">Sistema Hospitalario</div>
            <h1 class="h3 fw-bold mb-2">Bienvenido</h1>
            <p class="text-secondary small mb-0">Accede de forma segura a la administración hospitalaria.</p>
        </div>

        <div class="alert alert-danger small" th:if="${error != null and !error.isEmpty()}" th:text="${error}"></div>

        <div class="alert alert-success small" th:if="${mensajeLogout != null and !mensajeLogout.isEmpty()}" th:text="${mensajeLogout}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="identificador">Usuario o correo</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                    <input class="form-control" type="text" id="identificador" name="identificador" th:value="${identificadorPrevio}" placeholder="admin o admin@hospital.com" autocomplete="username" />
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="contrasena">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                    <input class="form-control" type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" autocomplete="current-password" />
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar al sistema <i class="bi bi-arrow-right ms-1"></i></button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a class="small text-decoration-none fw-semibold" th:href="@{/forgot-password}">¿Olvidaste tu contraseña?</a>
            <p class="small text-secondary mb-0 mt-3"><i class="bi bi-shield-lock me-1"></i>Acceso exclusivo para personal autorizado.</p>
        </div>
    </div>
</main>

</body>
</html>
