<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Roles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Roles</h2>
        <a th:href="@{/roles/nuevo}" class="btn btn-primary">Nuevo rol</a>
    </div>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-bordered bg-white align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Permisos asignados</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rol : ${roles}">
            <td th:text="${rol.idRol}"></td>
            <td th:text="${rol.nombre}"></td>
            <td th:text="${rol.descripcion}"></td>
            <td th:text="${#sets.size(rol.permisos)}"></td>
            <td>
                <a th:href="@{/roles/{id}/editar(id=${rol.idRol})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/roles/{id}/permisos(id=${rol.idRol})}" class="btn btn-sm btn-info">Permisos</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(roles)}">
            <td colspan="5" class="text-center text-muted">No hay roles registrados</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
