<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles | Sistema Hospitalario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-shell">
<nav class="navbar navbar-expand app-navbar" aria-label="Navegación principal">
    <div class="container">
        <span class="navbar-brand"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Hospitalario</span>
        <div class="navbar-nav">
            <a class="nav-link text-white" th:href="@{/dashboard}"><i class="bi bi-grid-1x2 me-1"></i>Inicio</a>
            <a th:if="${puedeVerUsuarios}" class="nav-link text-white" th:href="@{/usuarios}"><i class="bi bi-people me-1"></i>Usuarios</a>
            <a th:if="${puedeVerRoles}" class="nav-link text-white is-current" th:href="@{/roles}"><i class="bi bi-shield-check me-1"></i>Roles</a>
            <a class="nav-link text-white logout-link" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-1"></i>Salir</a>
        </div>
    </div>
</nav>
<main class="app-main container py-4 py-lg-5">
    <div class="page-hero">
        <div class="page-hero-copy">
            <p class="auth-kicker mb-1">Administración</p>
            <h1 class="page-heading">Roles y permisos</h1>
            <p class="page-subtitle">Define los niveles de acceso del sistema.</p>
        </div>
        <a th:if="${puedeEditar}" th:href="@{/roles/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo rol</a>
        <div th:unless="${puedeEditar}" class="page-hero-icon"><i class="bi bi-shield-lock"></i></div>
    </div>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="content-card overflow-hidden">
    <div class="table-responsive">
    <table class="table data-table align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Área</th>
            <th>Descripción</th>
            <th>Permisos asignados</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rol : ${roles}">
            <td th:text="${rol.idRol}"></td>
            <td class="table-primary-text" th:text="${rol.nombre}"></td>
            <td><span class="count-badge" th:text="${rol.area}"></span></td>
            <td class="table-muted-text" th:text="${rol.descripcion}"></td>
            <td><span class="count-badge" th:text="${#sets.size(rol.permisos)} + ' permisos'"></span></td>
            <td>
                <span th:unless="${puedeEditar}" class="text-muted small">Sin permiso</span>
                <a th:if="${puedeEditar}" th:href="@{/roles/{id}/editar(id=${rol.idRol})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:if="${puedeEditar}" th:href="@{/roles/{id}/permisos(id=${rol.idRol})}" class="btn btn-sm btn-info">Permisos</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(roles)}">
            <td colspan="6" class="text-center text-muted">No hay roles registrados</td>
        </tr>
        </tbody>
    </table>
    </div>
    </section>
</main>
</body>
</html>
