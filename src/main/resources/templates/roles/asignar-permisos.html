<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar permisos | Sistema Hospitalario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-shell">
<nav class="navbar navbar-expand app-navbar" aria-label="Navegación principal">
    <div class="container">
        <span class="navbar-brand"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Hospitalario</span>
        <div class="navbar-nav">
            <a class="nav-link text-white" th:href="@{/dashboard}"><i class="bi bi-grid-1x2 me-1"></i>Inicio</a>
            <a th:if="${puedeVerUsuarios}" class="nav-link text-white" th:href="@{/usuarios}"><i class="bi bi-people me-1"></i>Usuarios</a>
            <a th:if="${puedeVerRoles}" class="nav-link text-white is-current" th:href="@{/roles}"><i class="bi bi-shield-check me-1"></i>Roles</a>
            <a th:if="${puedeVerAuditoria}" class="nav-link text-white" th:href="@{/auditoria}"><i class="bi bi-journal-check me-1"></i>Auditoría</a>
            <a class="nav-link text-white logout-link" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-1"></i>Salir</a>
        </div>
    </div>
</nav>
<main class="app-main container py-4 py-lg-5" style="max-width: 880px;">
    <div class="page-hero">
        <div class="page-hero-copy">
            <p class="auth-kicker mb-1">Configuración de acceso</p>
            <h1 class="page-heading">Permisos de <span th:text="${rol.nombre}"></span></h1>
            <p class="page-subtitle">Selecciona las acciones habilitadas para este rol.</p>
        </div>
        <div class="page-hero-icon"><i class="bi bi-sliders"></i></div>
    </div>

    <form th:action="@{/roles/{id}/permisos(id=${rol.idRol})}" method="post" class="content-card p-4 p-lg-5">
        <div class="mb-4">
            <h2 class="section-heading">Acciones disponibles</h2>
            <p class="section-description">Marca únicamente las operaciones necesarias para este rol.</p>
        </div>
        <div th:each="permiso : ${permisos}" class="form-check permission-item">
            <input class="form-check-input" type="checkbox" name="permisoIds"
                   th:value="${permiso.idPermiso}"
                   th:id="${'permiso-' + permiso.idPermiso}"
                   th:checked="${idsAsignados.contains(permiso.idPermiso)}">
            <label class="form-check-label" th:for="${'permiso-' + permiso.idPermiso}"
                   th:text="${#strings.capitalize(#strings.toLowerCase(permiso.modulo))} + ' - ' + ${#strings.capitalize(#strings.toLowerCase(permiso.nombre))}"></label>
        </div>

        <div th:if="${#lists.isEmpty(permisos)}" class="text-muted text-center py-4">No hay permisos registrados</div>

        <div class="d-flex flex-wrap gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Guardar permisos</button>
            <a th:href="@{/roles}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
