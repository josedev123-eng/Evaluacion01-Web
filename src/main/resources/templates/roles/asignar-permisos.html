<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asignar permisos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2>Asignar permisos a: <span th:text="${rol.nombre}"></span></h2>

    <form th:action="@{/roles/{id}/permisos(id=${rol.idRol})}" method="post" class="bg-white p-4 rounded shadow-sm">
        <div th:each="permiso : ${permisos}" class="form-check">
            <input class="form-check-input" type="checkbox" name="permisoIds"
                   th:value="${permiso.idPermiso}"
                   th:id="${'permiso-' + permiso.idPermiso}"
                   th:checked="${idsAsignados.contains(permiso.idPermiso)}">
            <label class="form-check-label" th:for="${'permiso-' + permiso.idPermiso}"
                   th:text="${permiso.modulo + ' - ' + permiso.nombre}"></label>
        </div>

        <div th:if="${#lists.isEmpty(permisos)}" class="text-muted">No hay permisos registrados</div>

        <button type="submit" class="btn btn-primary mt-3">Guardar permisos</button>
        <a th:href="@{/roles}" class="btn btn-secondary mt-3">Cancelar</a>
    </form>
</div>
</body>
</html>
