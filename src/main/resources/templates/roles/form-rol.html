<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${rol.idRol} != null ? 'Editar rol' : 'Nuevo rol'">Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 th:text="${rol.idRol} != null ? 'Editar rol' : 'Nuevo rol'">Rol</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/roles/guardar}" th:object="${rol}" method="post" class="bg-white p-4 rounded shadow-sm">
        <input type="hidden" th:field="*{idRol}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required maxlength="50">
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" maxlength="255"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/roles}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
