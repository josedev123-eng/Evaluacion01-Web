<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${rol.idRol} != null ? 'Editar rol' : 'Nuevo rol'">Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-shell">
<nav class="navbar navbar-expand app-navbar" aria-label="Navegación principal">
    <div class="container">
        <span class="navbar-brand"><i class="bi bi-heart-pulse-fill me-2"></i>Sistema Hospitalario</span>
        <div class="navbar-nav">
            <a class="nav-link text-white" th:href="@{/dashboard}"><i class="bi bi-grid-1x2 me-1"></i>Inicio</a>
            <a th:if="${puedeVerUsuarios}" class="nav-link text-white" th:href="@{/usuarios}"><i class="bi bi-people me-1"></i>Usuarios</a>
            <a th:if="${puedeVerRoles}" class="nav-link text-white is-current" th:href="@{/roles}"><i class="bi bi-shield-check me-1"></i>Roles</a>
            <a th:if="${puedeVerAuditoria}" class="nav-link text-white" th:href="@{/auditoria}"><i class="bi bi-journal-check me-1"></i>Auditoría</a>
            <a class="nav-link text-white logout-link" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-1"></i>Salir</a>
        </div>
    </div>
</nav>
<main class="app-main container py-4 py-lg-5" style="max-width: 880px;">
    <div class="page-hero">
        <div class="page-hero-copy">
            <p class="auth-kicker mb-1">Configuración de acceso</p>
            <h1 class="page-heading" th:text="${rol.idRol} != null ? 'Editar rol' : 'Nuevo rol'">Rol</h1>
            <p class="page-subtitle">Asigna un nombre y una descripción clara para este perfil.</p>
        </div>
        <div class="page-hero-icon"><i class="bi bi-person-badge"></i></div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/roles/guardar}" th:object="${rol}" method="post" class="content-card p-4 p-lg-5">
        <input type="hidden" th:field="*{idRol}">

        <div class="form-section">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required maxlength="50"
                   th:readonly="${@autorizacionService.esRolAdministrador(rol)}">
            <div th:if="${@autorizacionService.esRolAdministrador(rol)}" class="form-text">El nombre Administrador está reservado y no se puede cambiar.</div>

            <label class="form-label mt-3">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" maxlength="255"></textarea>

            <label class="form-label mt-3">Área</label>
            <select th:field="*{area}" class="form-select" required>
                <option value="">-- Seleccione un área --</option>
                <option value="Administración">Administración</option>
                <option value="Medicina">Medicina</option>
                <option value="Enfermería">Enfermería</option>
                <option value="Recepción">Recepción</option>
                <option value="Laboratorio">Laboratorio</option>
                <option value="Farmacia">Farmacia</option>
            </select>
        </div>

        <div class="d-flex gap-2 pt-2">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Guardar</button>
            <a th:href="@{/roles}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
