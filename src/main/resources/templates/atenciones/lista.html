<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atenciones | Sistema Hospitalario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-shell">
<nav th:replace="~{fragments/navegacion :: barra('atenciones')}"></nav>
<main class="app-main container py-4 py-lg-5">
    <div class="page-hero">
        <div class="page-hero-copy">
            <p class="auth-kicker mb-1">Registro clínico</p>
            <h1 class="page-heading" th:text="${esAdministrador} ? 'Atenciones' : 'Mis atenciones'"></h1>
            <p class="page-subtitle" th:text="${esAdministrador} ? 'Revisión de las últimas 100 atenciones de todos los profesionales.' : 'Últimas 100 atenciones registradas con tu cuenta. No se muestran notas de otros profesionales.'"></p>
        </div>
        <a th:href="@{/pacientes}" class="btn btn-outline-primary">Buscar paciente</a>
    </div>
    <div th:replace="~{fragments/atenciones :: historial(${atenciones}, true)}"></div>
    <p class="small text-muted mt-3">Para registrar una atención, abre la ficha de un paciente. Demostración con datos ficticios.</p>
</main>
</body>
</html>
